<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MenuForTwo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#24312a;--muted:#68746c;--green:#2f6b4f;--pale:#e5f1e8;--line:#e1e6df;--red:#a83e36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}header{background:linear-gradient(135deg,#244c39,#43815d);color:#fff;padding:22px 16px}header h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:#e4efe7}main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}label{display:block;font-size:14px;color:var(--muted);margin:9px 0 4px}input,select{font:inherit;width:100%;padding:11px;border:1px solid #cfd8d0;border-radius:10px;background:#fff;color:var(--ink)}button{font:inherit;border:0;border-radius:10px;padding:10px 13px;background:var(--green);color:white;cursor:pointer}button.secondary{background:var(--pale);color:var(--green)}button.ghost{background:#f0f2ef;color:var(--ink)}button.danger{background:#f9e8e6;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{flex:1;min-width:max-content}.tabs button.active{background:#203e2f}.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}.status{padding:10px 12px;border-radius:10px;background:#eef4ef;margin-bottom:12px}.status.error{background:#f9e8e6;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.recipe,.day{border:1px solid var(--line);border-radius:14px;padding:13px;background:white}.recipe{display:flex;flex-direction:column;gap:8px}.recipe .actions{margin-top:auto}.tag{display:inline-block;font-size:12px;background:var(--pale);color:var(--green);padding:3px 8px;border-radius:99px}.meal{padding:10px 0;border-bottom:1px solid var(--line)}.meal:last-child{border:0}.meal-title{font-size:13px;color:var(--muted)}.meal-name{font-weight:600}.list{list-style:none;margin:0;padding:0}.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list li span{flex:1}.list li.done span{text-decoration:line-through;color:var(--muted)}.modalback{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal{width:min(650px,100%);max-height:88vh;overflow:auto;background:white;border-radius:18px;padding:18px}.modalhead{display:flex;justify-content:space-between;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.row{grid-template-columns:1fr}main{padding:11px}}
</style></head><body><header><h1>🍲 MenuForTwo</h1><p>Общее меню, рецепты и список покупок для вас двоих</p></header><main>
<div id="status" class="status">Подключаемся…</div><section id="auth" class="card"><h2>Вход в аккаунт</h2><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="email"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="login">Войти</button><button id="signup" class="secondary">Регистрация</button></div></section>
<section id="app" class="hidden"><div class="card row" style="align-items:center"><div><b id="who"></b><div class="muted">Общие данные для двух аккаунтов</div></div><div style="text-align:right"><button id="logout" class="ghost">Выйти</button></div></div><nav class="tabs"><button class="active" data-tab="menu">Меню на неделю</button><button data-tab="recipes">Рецепты</button><button data-tab="shopping">Список покупок</button></nav>
<section id="tab-menu" class="card"><h2>Меню на неделю</h2><p class="muted">Выбери рецепт для любого дня и приёма пищи.</p><div id="week" class="grid"></div></section>
<section id="tab-recipes" class="card hidden"><h2>Рецепты</h2><p class="muted">Нажми «Открыть рецепт» для ингредиентов и инструкции.</p><div id="recipes" class="grid"></div></section>
<section id="tab-shopping" class="card hidden"><h2>Список покупок</h2><div class="row"><div><label for="item">Продукт</label><input id="item" placeholder="Например, яблоки"></div><div><label for="qty">Количество</label><input id="qty" placeholder="Например, 4 шт."></div></div><div class="actions"><button id="add">Добавить продукт</button></div><ul id="shopping" class="list" style="margin-top:12px"></ul></section></section></main><div id="modal"></div>
<script>
(()=>{const URL='https://wyjngpfmpsnxlcfskvov.supabase.co',KEY='sb_publishable_Z3AU2jQeZTgCADjMqUcm0g_DSJG3GGX',db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let user=null,recipes=[],menu=[],items=[];const meals=[['breakfast','Завтрак'],['lunch','Обед'],['dinner','Ужин']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const say=(s,err=false)=>{$('status').textContent=s;$('status').className='status'+(err?' error':'')};const daystr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function dates(){let n=new Date(),d=(n.getDay()+6)%7,m=new Date(n);m.setDate(n.getDate()-d);m.setHours(12,0,0,0);return Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return x})}function nice(d){return d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'short'})}function tab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['menu','recipes','shopping'].forEach(x=>$('tab-'+x).classList.toggle('hidden',x!==t))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function loadRecipes(){let r=await db.from('recipes').select('id,title,category,ingredients,instructions,image_url').order('id');if(r.error)throw r.error;recipes=r.data||[];renderRecipes();renderMenu()}function ingredient(i){return typeof i==='object'&&i?[i.name,i.quantity].filter(Boolean).join(' — '):String(i??'')}function renderRecipes(){$('recipes').innerHTML=recipes.length?recipes.map(r=>`<article class="recipe"><div>${r.category?`<span class="tag">${esc(r.category)}</span>`:''}</div><h3>${esc(r.title)}</h3><div class="muted">${Array.isArray(r.ingredients)?r.ingredients.length:0} ингредиентов</div><div class="actions"><button class="secondary" data-open="${r.id}">Открыть рецепт</button><button data-pickrecipe="${r.id}">В меню</button></div></article>`).join(''):'<p class="muted">Рецептов пока нет.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRecipe(+b.dataset.open));document.querySelectorAll('[data-pickrecipe]').forEach(b=>b.onclick=()=>picker(+b.dataset.pickrecipe))}function openRecipe(id){let r=recipes.find(x=>+x.id===id);if(!r)return;let ing=Array.isArray(r.ingredients)?r.ingredients:[];$('modal').innerHTML=`<div class="modalback" id="back"><div class="modal"><div class="modalhead"><div><span class="tag">${esc(r.category||'Рецепт')}</span><h2 style="margin-top:8px">${esc(r.title)}</h2></div><button class="ghost" id="close">Закрыть</button></div><h3>Ингредиенты</h3><ul>${ing.map(i=>`<li>${esc(ingredient(i))}</li>`).join('')||'<li>Не указаны</li>'}</ul><h3>Приготовление</h3><p style="white-space:pre-line">${esc(r.instructions||'Инструкция не указана.')}</p><button id="use">Добавить в меню</button></div></div>`;$('close').onclick=close;$('back').onclick=e=>{if(e.target.id==='back')close()};$('use').onclick=()=>{close();picker(id)}}function close(){$('modal').innerHTML=''}
async function loadMenu(){let ds=dates(),a=daystr(ds[0]),b=daystr(ds[6]),r=await db.from('weekly_menu').select('menu_date,meal_slot,recipe_id,recipe_name,selected_by,updated_at').gte('menu_date',a).lte('menu_date',b);if(r.error)throw r.error;menu=r.data||[];renderMenu()}function renderMenu(){$('week').innerHTML=dates().map(d=>{let date=daystr(d);return `<article class="day"><h3>${esc(nice(d))}</h3>${meals.map(([slot,label])=>{let row=menu.find(x=>String(x.menu_date).slice(0,10)===date&&x.meal_slot===slot);return `<div class="meal"><div class="meal-title">${label}</div><div class="meal-name">${row?.recipe_name?esc(row.recipe_name):'<span class="muted">Пока не выбрано</span>'}</div><div class="actions"><button class="secondary" data-date="${date}" data-slot="${slot}">Выбрать рецепт</button>${row?.recipe_name?`<button class="ghost" data-clear-date="${date}" data-clear-slot="${slot}">Убрать</button>`:''}</div></div>`}).join('')}</article>`}).join('');document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>picker(null,b.dataset.date,b.dataset.slot));document.querySelectorAll('[data-clear-date]').forEach(b=>b.onclick=()=>clearSlot(b.dataset.clearDate,b.dataset.clearSlot))}
function picker(recipeId=null,date=null,slot=null){if(recipeId){date=date||daystr(dates()[0]);slot=slot||'dinner'}$('modal').innerHTML=`<div class="modalback" id="pickback"><div class="modal"><div class="modalhead"><h2>Выбрать рецепт</h2><button class="ghost" id="pickclose">Закрыть</button></div><label>День</label><select id="pickdate">${dates().map(d=>`<option value="${daystr(d)}" ${daystr(d)===date?'selected':''}>${esc(nice(d))}</option>`).join('')}</select><label>Приём пищи</label><select id="pickslot">${meals.map(([s,l])=>`<option value="${s}" ${s===slot?'selected':''}>${l}</option>`).join('')}</select><p class="muted">Выбери блюдо:</p><div id="picklist">${recipes.map(r=>`<button style="display:block;width:100%;text-align:left;margin:5px 0" data-save="${r.id}" class="secondary">${esc(r.title)}${r.category?' — '+esc(r.category):''}</button>`).join('')||'<p class="muted">Рецептов пока нет.</p>'}</div></div></div>`;$('pickclose').onclick=close;$('pickback').onclick=e=>{if(e.target.id==='pickback')close()};document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveMenu(+b.dataset.save,$('pickdate').value,$('pickslot').value))}
async function saveMenu(id,date,slot){let r=recipes.find(x=>+x.id===id);if(!r)return;say('Сохраняю меню…');let q=await db.from('weekly_menu').select('menu_date').eq('menu_date',date).eq('meal_slot',slot).maybeSingle();if(q.error){say('Ошибка проверки меню: '+q.error.message,true);return}let res=q.data?await db.from('weekly_menu').update({recipe_id:r.id,recipe_name:r.title,selected_by:user.id,updated_at:new Date().toISOString()}).eq('menu_date',date).eq('meal_slot',slot):await db.from('weekly_menu').insert({menu_date:date,meal_slot:slot,recipe_id:r.id,recipe_name:r.title,selected_by:user.id,updated_at:new Date().toISOString()});if(res.error){say('Не удалось сохранить: '+res.error.message,true);return}close();await loadMenu();say('Рецепт сохранён в общем меню.')}async function clearSlot(date,slot){let r=await db.from('weekly_menu').delete().eq('menu_date',date).eq('meal_slot',slot);if(r.error){say('Не удалось убрать рецепт: '+r.error.message,true);return}await loadMenu();say('Рецепт убран из меню.')}
async function loadItems(){let r=await db.from('shopping_items').select('id,item_name,quantity,is_bought').order('created_at');if(r.error)throw r.error;items=r.data||[];renderItems()}function renderItems(){$('shopping').innerHTML=items.length?items.map(i=>`<li class="${i.is_bought?'done':''}"><input style="width:20px;height:20px" type="checkbox" data-check="${i.id}" ${i.is_bought?'checked':''}><span>${esc(i.item_name)}${i.quantity?' ('+esc(i.quantity)+')':''}</span><button class="danger" data-delete="${i.id}">Удалить</button></li>`).join(''):'<li class="muted">Список пока пуст.</li>';document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>toggle(b.dataset.check,b.checked));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>delItem(b.dataset.delete))}async function addItem(){let name=$('item').value.trim(),qty=$('qty').value.trim();if(!name){say('Введи название продукта.',true);return}let r=await db.from('shopping_items').insert({item_name:name,quantity:qty,is_bought:false});if(r.error){say('Не удалось добавить: '+r.error.message,true);return}$('item').value='';$('qty').value='';await loadItems();say('Добавлено в общий список.')}async function toggle(id,value){let r=await db.from('shopping_items').update({is_bought:value}).eq('id',id);if(r.error){say('Ошибка: '+r.error.message,true);return}await loadItems()}async function delItem(id){let r=await db.from('shopping_items').delete().eq('id',id);if(r.error){say('Ошибка: '+r.error.message,true);return}await loadItems()}
async function refresh(){try{await Promise.all([loadRecipes(),loadMenu(),loadItems()]);say('Подключено. Данные обновляются автоматически.')}catch(e){say('Ошибка загрузки: '+(e.message||e),true)}}async function session(s){user=s?.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user){$('who').textContent=user.email||'Аккаунт';await refresh()}else say('Войди в аккаунт, чтобы открыть общее меню.')}$('login').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return say('Введи почту и пароль.',true);let r=await db.auth.signInWithPassword({email,password});if(r.error)return say('Ошибка входа: '+r.error.message,true);await session(r.data.session)};$('signup').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return say('Введи почту и пароль.',true);let r=await db.auth.signUp({email,password});if(r.error)return say('Ошибка регистрации: '+r.error.message,true);say('Регистрация отправлена. Если требуется подтверждение почты, проверь настройки Supabase.')};$('logout').onclick=async()=>{await db.auth.signOut();await session(null)};$('add').onclick=addItem;$('item').onkeydown=e=>{if(e.key==='Enter')addItem()};db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>session(s),0));setInterval(()=>{if(user)refresh()},12000);db.auth.getSession().then(({data})=>session(data.session));})();
</script></body></html>
